name: Deploy to GitHub Pages

# Publish-only: this builds the frontend against the JSON bundle already
# committed under frontend/public/data and deploys it. It never scrapes PIB
# and never calls Claude, so it costs nothing to run and needs no secrets —
# which matters, because this repository is public.
#
# To refresh the site's data, run the export locally and push the result:
#     pib-agent export-static --days 30
#
# Deliberately not triggered by pull_request: a workflow with Pages write
# permission should not run on code from a fork.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. Queue rather than cancel, so a push that lands mid-run
# still publishes instead of being silently dropped.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Fail if the data bundle is missing
        # Without it the site builds cleanly and then serves an app that 404s
        # on every request — a green deploy hiding a broken site.
        run: |
          if [ ! -f public/data/index.json ]; then
            echo "::error::public/data/index.json not found. Run 'pib-agent export-static' and commit the result."
            exit 1
          fi
          echo "Bundle meta: $(cat public/data/meta.json)"

      - name: Build
        env:
          VITE_STATIC_MODE: 'true'
          # Optional. A GA4 measurement ID is not a secret (it ships in the
          # page source), but it lives in repo settings so a fork does not
          # report into this property. Unset means analytics no-op.
          VITE_GA_MEASUREMENT_ID: ${{ vars.GA_MEASUREMENT_ID }}
        run: |
          # Project sites are served from https://<user>.github.io/<repo>/, so
          # assets and router links need that prefix. Derived from the repo
          # name rather than hard-coded, so a rename or a fork doesn't quietly
          # produce a site with broken asset URLs.
          export VITE_BASE_PATH="/${GITHUB_REPOSITORY#*/}/"
          echo "Base path: $VITE_BASE_PATH"
          npm run build

      - name: Add SPA fallback
        # GitHub Pages has no catch-all rewrite, so a deep link like
        # /PIB-Direct/articles/419 would 404 on hard load or refresh. Pages
        # serves 404.html for unmatched paths; making it a copy of index.html
        # boots the SPA, and the router resolves the route client-side.
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
